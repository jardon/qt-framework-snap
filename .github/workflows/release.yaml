name: Remote build and release

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '[0-9]+.[0-9]+'

jobs:
  build:
    uses: ./.github/workflows/build.yaml
  release:
    name: 🚢 Release to channel
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: snap-artifact
        path: .
    - name: Get snap file name
      id: snap-file-name
      run: echo "snap-name=$(ls *.snap)" >> $GITHUB_OUTPUT
    - uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
      with:
        snap: ${{ steps.snap-file-name.outputs.snap-name }}
        release: stable
